# Gateway for the ts6 development server (dev/docker-compose.yml).
#   cargo run -p voelin-gateway -- --config dev/tsgw-ts6.toml

[server]
# Inside the container the voice port is always 9987.
voice_port = 9987

[query]
transport = "ssh"
addr = "127.0.0.1:10022"
user = "serveradmin"
password = "voelin-dev-admin"
allowlisted = true

[listen]
bind = "127.0.0.1:7788"

[relay]
idle_teardown_secs = 30

[history]
path = "dev/.state/tsgw-ts6.db"
