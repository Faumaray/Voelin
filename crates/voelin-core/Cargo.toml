[package]
name = "voelin-core"
version = "0.1.0"
description = "Client engine: server sessions merging voice, gateway and query sources; the API the UI drives."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["audio-device"]
# Capture and play audio through the system's devices.
audio-device = ["voelin-audio/device"]
# The `media` module: capture and video codecs for streams, with whatever
# voelin-media backends are enabled (e.g. MediaCodec and a registered capture
# source on Android).
media = ["dep:voelin-media"]
# `media` with voelin-media's desktop backends: libvpx, dav1d, OpenH264 and
# FFmpeg loaded at runtime, X11 and PipeWire on Linux. Not for Android
# (libvpx does not cross-compile there).
media-desktop = ["media", "voelin-media/default"]

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
futures = "0.3"
# Finding a server's gateway in DNS (the voice resolver's version).
hickory-resolver = "0.26"
md5 = "0.8"
# A stalled HTTP/2 connection's error, told apart (the version reqwest's hyper
# uses).
h2 = "0.4"
# Retry-After dates (already in the tree through hyper).
httpdate = "1"
# Banners on the web; the client the workspace has (voelin-query, voelin-media).
# `system-proxy`: the proxy settings of Windows and macOS; `socks`: SOCKS
# proxies (from the desktop's settings or ALL_PROXY).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "socks", "system-proxy"] }
# Reading the official clients' settings.db when importing identities.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30"
toml = "1.1.6"
tracing = "0.1"
voelin-audio = { path = "../voelin-audio", default-features = false }
voelin-gateway-proto = { path = "../voelin-gateway-proto", features = ["client"] }
voelin-media = { path = "../voelin-media", default-features = false, features = ["str0m", "whip"], optional = true }
voelin-model = { path = "../voelin-model" }
voelin-observer = { path = "../voelin-observer" }
# Paths only (the cache directory).
voelin-platform = { path = "../voelin-platform", default-features = false }
voelin-query = { path = "../voelin-query" }
voelin-store = { path = "../voelin-store" }
voelin-stream = { path = "../voelin-stream" }
tsclientlib = { path = "../proto/tsclientlib" }
# The hash cash level, for raising an identity's security level.
tsproto = { path = "../proto/tsproto" }
tsproto-packets = { path = "../proto/tsproto-packets" }
tsproto-types = { path = "../proto/tsproto-types" }

[dev-dependencies]
# An HTTP/2 connection in a test (both already in the tree through h2).
bytes = "1"
http = "1"
# Already in the app's graph (reqwest); for one_rustls_crypto_provider.
rustls = { version = "0.23", default-features = false }
voelin-myts = { path = "../voelin-myts" }
# `process`: the browser interop test drives Chromium through Node.js.
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
