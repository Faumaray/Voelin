[package]
name = "voelin-android"
version = "0.0.1-alpha"
description = "Android app library: native activity entry point, engine kept for the whole process, JNI bridge to the Kotlin services (voice, screen share), Android Keystore secrets."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "voelin_android"
# cdylib: libvoelin_android.so, loaded by the app's NativeActivity. rlib: tests
# and type checks on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
voelin-core = { path = "../voelin-core" }
# Channels and people for the voice notification.
voelin-model = { path = "../voelin-model" }

[target.'cfg(target_os = "android")'.dependencies]
anyhow = "1.0.104"
jni = "0.22.4"
rustls-platform-verifier = "0.7.1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
voelin-media = { path = "../voelin-media", default-features = false }
voelin-platform = { path = "../voelin-platform", default-features = false }
voelin-store = { path = "../voelin-store" }
voelin-ui = { path = "../voelin-ui" }

[dev-dependencies]
# Client ids of stream viewers in the tests.
tsclientlib = { path = "../proto/tsclientlib" }

[lints]
workspace = true
