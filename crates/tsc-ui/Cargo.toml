[package]
name = "tsc-ui"
version = "0.1.0"
description = "Slint user interface and the desktop binary."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tsc-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "6"
png = "0.18"
slint = { version = "1.18", features = ["renderer-software"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tsc-core = { path = "../tsc-core" }
tsc-model = { path = "../tsc-model" }
tsc-query = { path = "../tsc-query" }
tsc-store = { path = "../tsc-store", features = ["keyring"] }
tsclientlib = { path = "../proto/tsclientlib" }

[build-dependencies]
slint-build = "1.18"

[lints]
workspace = true
