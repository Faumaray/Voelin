[package]
name = "voelin-ui"
version = "0.0.1-alpha"
description = "Slint user interface and the desktop binary."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "voelin_ui"
path = "src/lib.rs"

[[bin]]
name = "voelin"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "6"
# Slint decodes pictures with `image`, which it builds with PNG and JPEG only;
# avatars, icons and banners on TeamSpeak servers are GIF and WebP too (the
# decoders are in the tree already, for SVG pictures).
image = { version = "0.25", default-features = false, features = ["gif", "webp"] }
# Twemoji archive blocks (raw deflate); already used by png.
miniz_oxide = "0.8"
png = "0.18"
serde = { version = "1", features = ["derive"] }
# Settings and gateway values as JSON (the advanced and integrations pages).
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Grapheme clusters for emoji in chat text.
unicode-segmentation = "1.13"
voelin-audio = { path = "../voelin-audio" }
voelin-core = { path = "../voelin-core", default-features = false, features = ["audio-device"] }
# Gateway data types (topics, pins, reactions, capability names).
voelin-gateway-proto = { path = "../voelin-gateway-proto" }
voelin-model = { path = "../voelin-model" }
# Crash reports and notices everywhere; hotkey backends on desktop (below).
voelin-platform = { path = "../voelin-platform", default-features = false }
voelin-query = { path = "../voelin-query" }
voelin-store = { path = "../voelin-store" }
tsclientlib = { path = "../proto/tsclientlib" }

# Desktop: the keyring for passwords, stream media with libvpx, OpenH264, X11
# and PipeWire, global hotkeys through the portal and X11.
[target.'cfg(not(target_os = "android"))'.dependencies]
voelin-myts = { path = "../voelin-myts" }
# winit's focus events (an unstable API, so this minor version only):
# messages are read only while the window has the focus (`app::watch_focus`).
slint = { version = "~1.18", features = ["renderer-software", "unstable-winit-030"] }
voelin-core = { path = "../voelin-core", default-features = false, features = ["media-desktop"] }
voelin-platform = { path = "../voelin-platform" }
voelin-store = { path = "../voelin-store", features = ["keyring"] }

# Android (voelin-android): no keyring backend (the app passes Keystore-backed
# secrets), no winit/femtovg, stream media through MediaCodec and the app's
# capture source. Slint's Android backend (the one the app runs) also brings
# the SVG and image decoders the icons and emoji need, so this crate builds
# alone for Android too.
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software", "backend-android-activity-06"] }
voelin-core = { path = "../voelin-core", default-features = false, features = ["media"] }

[build-dependencies]
slint-build = "1.18"

[lints]
workspace = true
