[package]
name = "voelin-stream"
version = "0.1.0"
description = "TeamSpeak 6 streams: signalling commands, JSON signal messages and WebRTC peers (str0m)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# DTLS with our SRTP profile order (third_party/dimpl, see its VOELIN-PATCH.md),
# with the features str0m's aws-lc-rs provider uses.
dimpl = { version = "0.7.4", default-features = false, features = ["aws-lc-rs", "rcgen"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = { version = "0.23.1", default-features = false, features = ["aws-lc-rs"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1"
tsclientlib = { path = "../proto/tsclientlib" }
tsproto-packets = { path = "../proto/tsproto-packets" }

[dev-dependencies]
anyhow = "1"
futures = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
