[package]
name = "tsclientlib"
version = "0.2.0"
authors = ["Flakebi <flakebi@t-online.de>"]
description = "A library to create TeamSpeak clients and bots."
repository = "https://github.com/ReSpeak/tsclientlib"
readme = "README.md"
keywords = ["teamspeak3", "ts3", "voip"]
categories = ["multimedia"]
license = "MIT OR Apache-2.0"
publish = false
edition = "2018"
include = [
	"/Cargo.toml",
	"/README.md",
	"**/*.rs",
]

[package.metadata.docs.rs]
features = ["unstable"]

[features]
default = ["audio", "default-tls"]
# Enable the unstable api
unstable = []
audio = ["opus2"]
# Enable default reqwest features.
# Use default-features=false on tsclientlib to configure reqwest differently.
default-tls = ["reqwest/charset", "reqwest/default-tls", "reqwest/http2"]

[dependencies]
opus2 = { version = "0.4", optional = true }
base64 = "0.22"
futures = "0.3"
git-testament = "0.2"
itertools = "0.14"
num-traits = "0.2"
pin-utils = "0.1"
rand = "0.10"
reqwest = { version = "0.13", default-features = false }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["time"] }
tokio-stream = "0.1"
tracing = "0.1"
hickory-net = "0.26"
hickory-resolver = "0.26"
ts-bookkeeping = { path = "../ts-bookkeeping", version = "0.1" }
tsproto = { path = "../tsproto", version = "0.2" }
tsproto-packets = { path = "../tsproto-packets", version = "0.1" }
tsproto-types = { path = "../tsproto-types", version = "0.1" }
url = "2"

[dev-dependencies]
anyhow = "1"
opus2 = "0.4"
cpal = "0.18"
once_cell = "1"
quickcheck = "1"
quickcheck_macros = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "rt", "signal"] }
tracing-subscriber = "0.3"
