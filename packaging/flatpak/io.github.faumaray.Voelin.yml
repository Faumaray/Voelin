# Flatpak manifest for the desktop app. See packaging/README.md for how to
# build it.
id: io.github.faumaray.Voelin
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # libclang for bindgen (the PipeWire bindings); the SDK has none.
  - org.freedesktop.Sdk.Extension.llvm20
command: voelin

finish-args:
  - --share=network
  - --share=ipc
  # Wayland, with X11 only where there is no Wayland session.
  - --socket=wayland
  - --socket=fallback-x11
  # GPU for video decoding and rendering.
  - --device=dri
  # Microphone and speakers (the PulseAudio API, served by PipeWire on
  # current desktops).
  - --socket=pulseaudio
  # PipeWire for capturing application audio when streaming. Screen capture
  # itself goes through the ScreenCast portal.
  - --filesystem=xdg-run/pipewire-0
  # Desktop notifications.
  - --talk-name=org.freedesktop.Notifications
  # Passwords in the Secret Service keyring.
  - --talk-name=org.freedesktop.secrets
  # Portals (GlobalShortcuts for push-to-talk, ScreenCast, file chooser) need
  # no permission.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
  env:
    CARGO_HOME: /run/build/voelin/cargo
    CARGO_NET_OFFLINE: "true"
    # flatpak-builder does not inherit Cargo settings from the outer job.
    CARGO_BUILD_JOBS: "1"
    CARGO_INCREMENTAL: "0"
    LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib

modules:
  - name: voelin
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked -p voelin-ui
      - install -Dm755 target/release/voelin -t /app/bin/
      - install -Dm644 packaging/linux/io.github.faumaray.Voelin.desktop -t /app/share/applications/
      - install -Dm644 packaging/linux/io.github.faumaray.Voelin.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 packaging/linux/io.github.faumaray.Voelin.svg -t /app/share/icons/hicolor/scalable/apps/
      # Also shown in the app's About page.
      - install -Dm644 THIRD_PARTY_NOTICES.md -t /app/share/licenses/io.github.faumaray.Voelin/
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
      # Vendored crates, generated from Cargo.lock (see packaging/README.md).
      - cargo-sources.json
