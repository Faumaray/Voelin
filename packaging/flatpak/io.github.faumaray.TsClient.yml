# Flatpak manifest for the desktop app. See packaging/README.md for how to
# build it. The app id is a placeholder until the product has a name.
id: io.github.faumaray.TsClient
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: tsc-desktop

finish-args:
  - --share=network
  - --share=ipc
  # Wayland, with X11 only where there is no Wayland session.
  - --socket=wayland
  - --socket=fallback-x11
  # GPU for video decoding and rendering.
  - --device=dri
  # Microphone and speakers (the PulseAudio API, served by PipeWire on
  # current desktops).
  - --socket=pulseaudio
  # PipeWire for capturing application audio when streaming. Screen capture
  # itself goes through the ScreenCast portal.
  - --filesystem=xdg-run/pipewire-0
  # Desktop notifications.
  - --talk-name=org.freedesktop.Notifications
  # Passwords in the Secret Service keyring.
  - --talk-name=org.freedesktop.secrets
  # Portals (GlobalShortcuts for push-to-talk, ScreenCast, file chooser) need
  # no permission.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/tsc/cargo
    CARGO_NET_OFFLINE: "true"

modules:
  - name: tsc
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked -p tsc-ui
      - install -Dm755 target/release/tsc-desktop -t /app/bin/
      - install -Dm644 packaging/linux/io.github.faumaray.TsClient.desktop -t /app/share/applications/
      - install -Dm644 packaging/linux/io.github.faumaray.TsClient.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 packaging/linux/io.github.faumaray.TsClient.svg -t /app/share/icons/hicolor/scalable/apps/
      # Also shown in the app's About page.
      - install -Dm644 THIRD_PARTY_NOTICES.md -t /app/share/licenses/io.github.faumaray.TsClient/
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
      # Vendored crates, generated from Cargo.lock (see packaging/README.md).
      - cargo-sources.json
