name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "0"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The vendored crates in crates/proto use upstream's nightly rustfmt config
      # and have known clippy findings (cleanup is milestone M1), so the strict
      # checks cover our own crates only.
      - name: rustfmt (own crates)
        run: cargo fmt $(scripts/own-crates.sh) --check
      - name: clippy (own crates, deny warnings)
        run: cargo clippy $(scripts/own-crates.sh) --all-targets --no-deps -- -D warnings
      - name: clippy (workspace, report only)
        run: cargo clippy --workspace --all-targets

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Default features only: the optional `rug` puzzle backend (GMP, LGPL) is
      # benchmark-only and never shipped.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace

  smoke:
    name: integration smoke (TS3 + TS6)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Start TeamSpeak servers
        run: docker compose -f dev/docker-compose.yml up -d
      - name: Smoke test
        run: scripts/it-smoke.sh
      - name: Server logs
        if: failure()
        run: docker compose -f dev/docker-compose.yml logs --no-color
