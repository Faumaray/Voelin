syntax = "proto3";

package com.teamspeak.myteamspeak.proto.cloud;

option java_generic_services = true;
option cc_generic_services = true;
option optimize_for = SPEED;

message BadgeList {
    int32 version = 1;
    int64 updated = 2;
    repeated Badge badges = 3;
}

message Badge {
    string uuid = 1;
    string name = 2;
    string url = 3;
    string description = 4;
    int64 created = 5;
    int32 version = 6;
}
