syntax = "proto3";

package com.teamspeak.myteamspeak.proto.namedserver;

option java_generic_services = true;
option cc_generic_services = true;
option optimize_for = SPEED;

message IpAddress {
    string ipv4 = 1;
    string ipv6 = 2;
}

message NamedServerTarget {
    oneof target {
        string domain_name = 1;
        IpAddress ip_address = 2;
    }
}

message User {
    string uuid = 1;
    string session = 2;
}

message NamedServer {
    User user = 1;
    string server_name = 2;
    NamedServerTarget target = 3;
    string session = 4;
}
