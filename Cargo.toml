[workspace]
resolver = "3"
# third_party: vendored crates patched in below (not workspace members, so
# their own tests and dev-dependencies stay out of our builds).
exclude = ["fuzz", "third_party"]
members = [
	"crates/proto/tsproto-types",
	"crates/proto/tsproto-structs",
	"crates/proto/tsproto-packets",
	"crates/proto/tsproto",
	"crates/proto/ts-bookkeeping",
	"crates/proto/tsclientlib",
	"crates/voelin-android",
	"crates/voelin-audio",
	"crates/voelin-core",
	"crates/voelin-gateway",
	"crates/voelin-gateway-proto",
	"crates/voelin-media",
	"crates/voelin-model",
	"crates/voelin-observer",
	"crates/voelin-platform",
	"crates/voelin-query",
	"crates/voelin-store",
	"crates/voelin-stream",
	"crates/voelin-ui",
	"tools/voelinctl",
]
default-members = [
	"crates/proto/tsproto-types",
	"crates/proto/tsproto-structs",
	"crates/proto/tsproto-packets",
	"crates/proto/tsproto",
	"crates/proto/ts-bookkeeping",
	"crates/proto/tsclientlib",
	"crates/voelin-audio",
	"crates/voelin-core",
	"crates/voelin-gateway",
	"crates/voelin-gateway-proto",
	"crates/voelin-model",
	"crates/voelin-observer",
	"crates/voelin-platform",
	"crates/voelin-query",
	"crates/voelin-store",
	"crates/voelin-stream",
	"crates/voelin-ui",
	"tools/voelinctl",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Faumaray/Voelin"
publish = false

[workspace.lints.rust]
# deny, not forbid: generated code (Slint) needs a local allow.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package.num-bigint]
# The Init1 puzzle does a large modular exponentiation on connect; unoptimized
# it takes seconds.
opt-level = 3

# Audio processing (echo cancellation, noise suppression) runs in real time on
# every 10 ms of microphone audio; unoptimized it needs about a third of a core.
[profile.dev.package.sonora]
opt-level = 3
[profile.dev.package.sonora-aec3]
opt-level = 3
[profile.dev.package.sonora-agc2]
opt-level = 3
[profile.dev.package.sonora-common-audio]
opt-level = 3
[profile.dev.package.sonora-fft]
opt-level = 3
[profile.dev.package.sonora-ns]
opt-level = 3
[profile.dev.package.sonora-simd]
opt-level = 3

# Screen sharing runs pixel conversion, codecs and RTP for every frame;
# unoptimized, a debug build manages a few frames per second at 1080p.
# (libvpx, dav1d and libopus are system / release-built C libraries.)
[profile.dev.package.yuv]
opt-level = 3
[profile.dev.package.voelin-media]
opt-level = 3
[profile.dev.package.str0m]
opt-level = 3
[profile.dev.package.str0m-proto]
opt-level = 3
[profile.dev.package.str0m-aws-lc-rs]
opt-level = 3
[profile.dev.package.openh264]
opt-level = 3
[profile.dev.package.dav1d]
opt-level = 3
[profile.dev.package.opus2]
opt-level = 3
[profile.dev.package.pipewire]
opt-level = 3
[profile.dev.package.libspa]
opt-level = 3
[profile.dev.package.x11rb-protocol]
opt-level = 3
# The studio's person segmentation (tract): unoptimized, one mask takes
# about half a second.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.wayland-backend]
opt-level = 3
[profile.dev.package.wayland-client]
opt-level = 3
# MJPEG cameras: unoptimized, a 1440p picture takes most of a second.
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev]
# Line tables (for backtraces) for workspace crates, no debug info for
# dependencies: keeps target/ several times smaller. Override locally for
# debugging with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# dimpl (DTLS for str0m) with a configurable SRTP profile order; see
# third_party/dimpl/VOELIN-PATCH.md.
[patch.crates-io]
dimpl = { path = "third_party/dimpl" }

[profile.release]
# Thin LTO keeps cross-crate optimisation without materialising the entire
# app in one LLVM module. Split codegen keeps the generated Slint UI within
# the memory budget of CI and release builders. Panics still
# unwind (no `panic = "abort"`): a panic in one tokio task or media thread
# must not end the app (tasks and threads report it, mutexes recover from
# poisoning), and the crash reporter's hook runs either way.
lto = "thin"
codegen-units = 16
