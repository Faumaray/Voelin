[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
	"crates/proto/tsproto-types",
	"crates/proto/tsproto-structs",
	"crates/proto/tsproto-packets",
	"crates/proto/tsproto",
	"crates/proto/ts-bookkeeping",
	"crates/proto/tsclientlib",
	"crates/tsc-audio",
	"crates/tsc-core",
	"crates/tsc-gateway",
	"crates/tsc-gateway-proto",
	"crates/tsc-model",
	"crates/tsc-observer",
	"crates/tsc-query",
	"crates/tsc-store",
	"crates/tsc-stream",
	"crates/tsc-ui",
	"tools/tsctl",
]
default-members = [
	"crates/proto/tsproto-types",
	"crates/proto/tsproto-structs",
	"crates/proto/tsproto-packets",
	"crates/proto/tsproto",
	"crates/proto/ts-bookkeeping",
	"crates/proto/tsclientlib",
	"crates/tsc-audio",
	"crates/tsc-core",
	"crates/tsc-gateway",
	"crates/tsc-gateway-proto",
	"crates/tsc-model",
	"crates/tsc-observer",
	"crates/tsc-query",
	"crates/tsc-store",
	"crates/tsc-stream",
	"crates/tsc-ui",
	"tools/tsctl",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Faumaray/teamspeak_client_rs"
publish = false

[workspace.lints.rust]
# deny, not forbid: generated code (Slint) needs a local allow.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package.num-bigint]
# The Init1 puzzle does a large modular exponentiation on connect; unoptimized
# it takes seconds.
opt-level = 3

[profile.dev]
# Line tables (for backtraces) for workspace crates, no debug info for
# dependencies: keeps target/ several times smaller. Override locally for
# debugging with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
