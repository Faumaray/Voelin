name: CI

# Linux checks for Gitea act_runner; runner setup and scope: docs/ci.md.
on:
  push:
    branches: [main, master]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "THIRD_PARTY_NOTICES.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "0"

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: ./.gitea/actions/checks
