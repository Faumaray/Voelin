# cargo-about configuration for THIRD_PARTY_NOTICES.md: scripts/notices.sh
# renders about.hbs with it (see docs/release.md). Reference:
# https://embarkstudios.github.io/cargo-about/cli/generate/config.html
#
# The accepted licenses are deny.toml's `[licenses] allow` list; their order is
# the preference when a crate offers a choice ("MIT OR Apache-2.0" shows MIT).

accepted = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"Unicode-3.0",
	"CDLA-Permissive-2.0",
	"MPL-2.0",
	"BSL-1.0",
	"Unlicense",
	# Slint: GPL-3.0-only OR royalty-free OR commercial. We use the royalty-free
	# license, which requires the AboutSlint widget in the About page.
	"LicenseRef-Slint-Royalty-free-2.0",
	# libbz2-rs-sys (unpacks Cisco's OpenH264 download in voelin-media).
	"bzip2-1.0.6",
]

# What the apps ship on: the desktop app on Linux (x86_64, and aarch64 for
# Flathub) and Windows, and the Android app. Crates used only on other
# platforms (macOS, iOS, wasm) are left out.
targets = [
	"x86_64-unknown-linux-gnu",
	"aarch64-unknown-linux-gnu",
	"x86_64-pc-windows-msvc",
	"aarch64-linux-android",
	"armv7-linux-androideabi",
	"x86_64-linux-android",
]

# Build tools (cc, cmake, bindgen, slint-build) and test-only crates are not
# part of any binary we distribute.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Our own crates (publish = false). The vendored tsclientlib crates in
# crates/proto are credited in about.hbs instead.
private = { ignore = true }

workarounds = ["chrono", "ring", "rustls"]

# Crate specific configuration must come last.
#
# Clarifications replace the license files cargo-about would find; each file
# is pinned by its SHA-256, so a changed text fails generation and gets
# reviewed. After a dependency update: `sha256sum <file>` in the new crate
# version (~/.cargo/registry/src/*/<crate>-<version>/).

# libopus_sys compiles the bundled libopus (opus/, BSD-3-Clause) into the app.
# The crate itself is MIT; LICENSE-old is the ISC license of the code it was
# derived from (audiopus_sys).
[libopus_sys.clarify]
license = "MIT AND ISC AND BSD-3-Clause"
[[libopus_sys.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "c5512e4899a9b06c3a286bf69444ebc5314d506e437c334bfd66a2eac7bca3ef"
[[libopus_sys.clarify.files]]
path = "LICENSE-old"
license = "ISC"
checksum = "a6c8bb45880edc99bb13feb04d69fb2f0f73b565dfe209affa60414d2aa4c1a7"
[[libopus_sys.clarify.files]]
path = "opus/COPYING"
license = "BSD-3-Clause"
checksum = "01e1167d54a096d123cf6dfbbeb19587278845c6481d2d66d545669846079551"

# Only the bindings are compiled (voelin-media loads Cisco's binary at runtime),
# but without this every header of the vendored OpenH264 sources would be
# listed. upstream/LICENSE is also the license of Cisco's binary.
[openh264-sys2.clarify]
license = "BSD-2-Clause"
[[openh264-sys2.clarify.files]]
path = "upstream/LICENSE"
checksum = "dd5c1c9668512530fa5a96e4c29ac4033d70a7eeb0eed7a42fddb6dd794ebdbb"

# AWS-LC (DTLS for WebRTC through str0m): LICENSE holds the attributions of
# BoringSSL, OpenSSL and the bundled third-party code plus all license texts.
# It is shown once, under ISC; the other licenses of the expression get their
# standard texts.
[aws-lc-sys.clarify]
license = "ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT) AND (Apache-2.0 OR ISC OR MIT-0)"
[[aws-lc-sys.clarify.files]]
path = "LICENSE"
license = "ISC"
checksum = "728536b4160e051f86d7c9c388f704866b3d512cd7df97ac3516c65279523c4e"

# Slint keeps its license texts in LICENSES/, which cargo-about does not match
# to the LicenseRef without a clarification. cargo-about 0.9.2 skips clarified
# files whose `license` names the LicenseRef they are the text of (an inverted
# check in generate.rs), so the file is tagged with a distinct LicenseRef; the
# text is still shown under LicenseRef-Slint-Royalty-free-2.0. Revisit when
# updating cargo-about (scripts/notices.sh fails if the text goes missing).
[slint.clarify]
license = "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0"
[[slint.clarify.files]]
path = "LICENSES/LicenseRef-Slint-Royalty-free-2.0.md"
license = "LicenseRef-Slint-Royalty-free-2.0-text"
checksum = "5167f5056e850419106ab6265efbdca7cba4d99c849d1445ca0bbf6a1e2315fe"

