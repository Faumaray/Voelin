# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Unmaintained crates are reported but only fail for direct dependencies.
unmaintained = "workspace"
ignore = [
	# Marvin attack: timing side channel in RSA *private-key* operations of the
	# `rsa` crate, pulled in by russh. TeamSpeak SSH query servers use RSA host
	# keys, so russh needs RSA to verify the server's signature (a public-key
	# operation). We never hold an RSA private key: query logins use passwords.
	{ id = "RUSTSEC-2023-0071", reason = "only RSA signature verification is used (SSH host keys)" },
]

[licenses]
# Permissive licenses only. AGPL/GPL code (e.g. astrum-ts6) must never be
# linked; LGPL may be revisited for dynamically linked codecs.
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"Unicode-3.0",
	"CDLA-Permissive-2.0",
	"MPL-2.0",
	"BSL-1.0",
	"Unlicense",
	# Slint is triple licensed (GPL-3.0-only OR royalty-free OR commercial); we
	# use the royalty-free license, which requires the attribution shown in the
	# app's About page and the README.
	"LicenseRef-Slint-Royalty-free-2.0",
	# Permissive BSD-style license of bzip2, kept by its pure Rust port
	# (libbz2-rs-sys), which voelin-media uses to unpack Cisco's OpenH264 download.
	"bzip2-1.0.6",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
