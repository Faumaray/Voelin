# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Unmaintained crates are reported but only fail for direct dependencies.
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses only. AGPL/GPL code (e.g. astrum-ts6) must never be
# linked; LGPL may be revisited for dynamically linked codecs.
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"Unicode-3.0",
	"CDLA-Permissive-2.0",
	"MPL-2.0",
	"BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
