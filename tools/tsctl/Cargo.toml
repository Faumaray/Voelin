[package]
name = "tsctl"
version = "0.1.0"
description = "Headless command-line client for TeamSpeak 3/6 servers, used for development and integration tests."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures = "0.3"
png = "0.18"
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tsclientlib = { path = "../../crates/proto/tsclientlib" }
tsproto-packets = { path = "../../crates/proto/tsproto-packets" }
tsc-model = { path = "../../crates/tsc-model" }
tsc-query = { path = "../../crates/tsc-query" }
tsc-observer = { path = "../../crates/tsc-observer" }
tsc-audio = { path = "../../crates/tsc-audio", default-features = false }
# The stream media pipeline (capture, VP8, decoding), without audio devices.
tsc-core = { path = "../../crates/tsc-core", default-features = false, features = ["media-desktop"] }
tsc-stream = { path = "../../crates/tsc-stream" }
tokio-tungstenite = "0.30"
futures-util = "0.3.34"
tsc-gateway-proto = { path = "../../crates/tsc-gateway-proto" }

[lints]
workspace = true
